# Render Blueprint: runs Threadform as a small Node web service behind a password.
# server.mjs has no dependencies and no build step. It serves nothing until a visitor logs in with
# SITE_PASSWORD, and sets strict security headers on every response (taken from vercel.json).
# Threadform makes no network requests of its own: all editing happens in the visitor's browser.
services:
  - type: web
    name: threadform
    runtime: node
    plan: free
    branch: main
    buildCommand: echo "no build step"
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false            # you type it in the Render dashboard; it is never stored in the repo
      - key: SESSION_SECRET
        generateValue: true    # Render generates a random secret so logins survive restarts
      # Optional: also require a username (set SITE_USERNAME in the dashboard), or change how long a login lasts:
      # - key: SESSION_DAYS
      #   value: "7"
