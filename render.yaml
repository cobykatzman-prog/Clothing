# Render Blueprint: runs Threadform as a small Node web service behind a password.
# server.mjs has no dependencies and no build step. It serves nothing until a visitor logs in with
# SITE_PASSWORD, and sets strict security headers on every response (taken from vercel.json).
# The browser only talks to this server. Only if SUPABASE_URL and SUPABASE_SERVICE_KEY are set does the server
# itself call your Supabase project (shared design library); otherwise nothing leaves the site.
services:
  - type: web
    name: threadform
    runtime: node
    plan: free
    branch: main
    buildCommand: echo "no build step"
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false            # you type it in the Render dashboard; it is never stored in the repo
      - key: SESSION_SECRET
        generateValue: true    # Render generates a random secret so logins survive restarts
      # Optional shared design library (see README, "Shared designs (Supabase)"). Both must be set to turn it on.
      - key: SUPABASE_URL
        sync: false            # e.g. https://abcdxyz.supabase.co, typed in the Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false            # the service_role key: server only, never put it in the repo
      # Optional individual logins and roles (README, 'Password login' and 'Shared workspace'); set in the dashboard, never in the repo.
      # - key: SITE_USERS      (alice:password,bob:password)
      # - key: SITE_ROLES      (alice:owner,bob:editor)
      # Optional AI editing (see README, "AI editing"). Without a key the app uses the local engine only.
      - key: OPENAI_API_KEY
        sync: false            # typed in the Render dashboard, never in the repo
      # - key: AI_IMAGE_MODEL   (default gpt-image-1)
      # - key: AI_VISION_MODEL  (default gpt-4.1-mini)
      # - key: AI_IMAGE_QUALITY (low | medium | high, default medium)
      # - key: AI_RATE_LIMIT / AI_RATE_WINDOW_MIN / AI_DAILY_LIMIT
      # Optional: also require a username (set SITE_USERNAME in the dashboard), or change how long a login lasts:
      # - key: SESSION_DAYS
      #   value: "7"
